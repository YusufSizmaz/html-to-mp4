<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spinner · html→mp4 example</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1a1a2e, #050505);
        font-family: -apple-system, system-ui, sans-serif;
        color: #fff;
        overflow: hidden;
      }
      .ring {
        width: 360px;
        height: 360px;
        border-radius: 50%;
        border: 2px solid rgba(163, 230, 53, 0.18);
        border-top-color: #a3e635;
        animation: spin 2s linear infinite;
        display: grid;
        place-items: center;
        position: relative;
      }
      .ring::before {
        content: "";
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        border: 1px dashed rgba(163, 230, 53, 0.25);
        animation: spin 8s linear infinite reverse;
      }
      .num {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #fff, #a3e635);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: pulse 1.6s ease-in-out infinite;
      }
      h1 {
        position: absolute;
        top: 12%;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.55;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: 0.55; } }
    </style>
  </head>
  <body>
    <h1>codynlab · render</h1>
    <div class="ring"><div class="num">HD</div></div>
  </body>
</html>
